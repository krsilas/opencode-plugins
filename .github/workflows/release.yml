name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push release tags
  id-token: write # npm trusted publishing + provenance

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - run: pnpm run test

      - run: pnpm run build

      # Publishes every workspace package whose version isn't on npm yet; already-published versions are skipped.
      - run: pnpm publish -r --access public --no-git-checks --report-summary

      - name: Tag published versions
        run: |
          [ -f pnpm-publish-summary.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in $(jq -r '.publishedPackages[] | "\(.name)@\(.version)"' pnpm-publish-summary.json); do
            git tag "$tag"
            git push origin "$tag"
          done
